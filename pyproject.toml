[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gpt"
version = "2.0.0"
description = "Evidence-gated ChatGPT Web session controller and reverse-engineering harness"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40.0",
    "cloakbrowser>=0.5.0",
    "pyotp>=2.9.0",
    "starlette>=0.30.0",
    "uvicorn>=0.25.0",
]

[project.scripts]
gpt = "gpt.debug:main"
gpt-web = "gpt.debug:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "anyio>=4.0", "ruff>=0.6", "mypy>=1.10", "openai>=1.0"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "SIM105"]
